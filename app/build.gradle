plugins {
    id 'com.android.application'
}

android {
    namespace 'com.raffletickets'
    compileSdk 34

    def ksProps = new Properties()
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) ksProps.load(new FileInputStream(ksFile))

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.raffletickets"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "1.6"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
